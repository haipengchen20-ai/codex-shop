<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多平台游戏图片收藏器</title><link rel="stylesheet" href="style.css"></head><body><main><header><span class="mark">◉</span><div><h1>多平台游戏图片收藏器</h1><p>将公开的游戏封面和截图自动保存到本机</p></div></header><section class="search"><input id="id" placeholder="输入 Steam、Nintendo、PlayStation 或 Xbox 官方商店链接（也支持 Steam AppID）"><button id="lookup">获取游戏图片</button></section><p class="hint">仅获取官方商店公开图片。</p><div id="message" role="status"></div><section id="game" hidden><div class="game-title"><div><span id="game-id"></span><h2 id="game-name"></h2></div><div><button class="secondary" id="select-all">全选</button><button class="secondary" id="select-none">全不选</button><button id="save">立即保存所选</button></div></div><div id="grid" class="grid"></div><div class="schedule"><div><h3>自动同步</h3><p>程序运行期间，按设定频率检查并更新所选图片。</p></div><label>每 <input id="hours" type="number" min="1" value="24"> 小时</label><button class="secondary" id="subscribe">启用自动保存</button></div></section><section class="subscriptions"><h2>自动保存任务</h2><div id="tasks"><p class="muted">正在读取任务…</p></div></section></main><script src="app.js"></script></body></html>
